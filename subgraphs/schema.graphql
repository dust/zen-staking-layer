type RewardNotifiedEvent @entity(immutable: true) {
  id: Bytes!
  amount: BigInt!
  notifier: Bytes!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# Unified, chronologically-ordered activity feed for the user history view.
# orderKey packs (blockNumber, logIndex) into one strictly-increasing cursor so
# the merged timeline paginates via orderKey_lt with no per-type holes.
# Kept last so the existing entities keep their original schema positions.
type Activity @entity(immutable: true) {
  id: Bytes!
  kind: String!
  account: Bytes!
  depositId: BigInt!
  amount: BigInt!
  orderKey: BigInt!
  blockNumber: BigInt!
  logIndex: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# ---------------------------------------------------------------------------
# StLighter liquid-staking layer (Compounding / Harvest / net-value charts).
# Appended after the ZenStaker entities so existing schema positions are stable.
# ---------------------------------------------------------------------------

# Exchange-rate snapshot — the CompoundChart data source. One point per triggering
# event (deposit/redeem/harvest/reward). `rate` = convertToAssets(1e18), sampled via
# eth_call at the event's block since the chain stores no historical rate.
type RateSnapshot @entity(immutable: true) {
  id: Bytes!
  rate: BigInt!
  totalAssets: BigInt!
  issuedShares: BigInt!
  trigger: String! # "deposit" | "redeem" | "harvest" | "reward"
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# Compounding history — the HarvestHistory data source.
type HarvestEvent @entity(immutable: true) {
  id: Bytes!
  rewardClaimed: BigInt!
  feeTaken: BigInt!
  restaked: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# StLighter deposit / redeem detail (reconciliation + per-user history).
type StLighterDeposit @entity(immutable: true) {
  id: Bytes!
  caller: Bytes!
  receiver: Bytes!
  assets: BigInt!
  shares: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type StLighterRedeem @entity(immutable: true) {
  id: Bytes!
  caller: Bytes!
  receiver: Bytes!
  shares: BigInt!
  assets: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# Per-day aggregate for long-range net-value charts (cheap to query).
# id = dayId (floor(timestamp / 86400)).
type ProtocolDayData @entity(immutable: false) {
  id: String!
  date: Int!
  rateOpen: BigInt!
  rateClose: BigInt!
  totalAssets: BigInt!
  issuedShares: BigInt!
  cumulativeRewardNotified: BigInt!
  aggregateStakedBalance: BigInt!
}

# Global singleton (id = "1") holding running totals.
type ProtocolMeta @entity(immutable: false) {
  id: String!
  cumulativeRewardNotified: BigInt!
  lastRate: BigInt!
  lastTotalAssets: BigInt!
  lastIssuedShares: BigInt!
}
