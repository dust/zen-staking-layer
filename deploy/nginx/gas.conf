# DEPRECATED: static nginx gas stub. Replaced by ../gas-provider (compose service gas-stub).
# Kept only for reference / local experiments.
#
# Horizen CUSTOM gas provider for rrelayer (compose-internal only).
# rrelayer: GET http://gas-stub:8787/2651420
# Not published to the host — edge TLS for staking.lighter.im lives elsewhere.

server {
    listen 8787;
    server_name _;

    location ~ ^/[0-9]+$ {
        default_type application/json;
        alias /usr/share/nginx/html/horizen-gas.json;
        add_header Cache-Control "no-cache";
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
}
