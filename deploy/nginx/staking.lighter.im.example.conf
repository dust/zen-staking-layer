# Example snippet for the *external* edge nginx (not managed by this compose).
# Terminate TLS for staking.lighter.im and reverse-proxy to ltzen-frontend.
#
# Same host as this compose (FRONTEND_BIND=127.0.0.1, FRONTEND_PORT=6000):
#   proxy_pass http://127.0.0.1:6000;
# Other host on the LAN (FRONTEND_BIND=0.0.0.0):
#   proxy_pass http://<ltzen-host-lan-ip>:6000;

server {
    listen 443 ssl;
    http2 on;
    server_name staking.lighter.im;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:6000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name staking.lighter.im;
    return 301 https://$host$request_uri;
}
