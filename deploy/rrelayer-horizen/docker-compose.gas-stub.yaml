# Local/dev only — Horizen CUSTOM gas sidecar when rrelayer runs on the host.
#
# Production VPS: use docker-compose.yml (nginx edge serves gas on :8787 internally).
#
# Usage:
#   docker compose -f docker-compose.gas-stub.yaml up -d
#   rrelayer.yaml gas endpoint: http://localhost:8787

services:
  gas-stub:
    image: nginx:1.27-alpine
    container_name: rrelayer-horizen-gas-stub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./horizen-gas.json:/usr/share/nginx/html/horizen-gas.json:ro
      - ./nginx.gas-only.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 10s
      timeout: 3s
      retries: 3
