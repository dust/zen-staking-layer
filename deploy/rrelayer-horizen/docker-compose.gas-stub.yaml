# Horizen CUSTOM gas provider sidecar for rrelayer.
#
# Usage (from your rrelayer project directory, after copying files — see README.md):
#   docker compose -f docker-compose.yml -f docker-compose.gas-stub.yaml up -d gas-stub
#
# Or standalone:
#   docker compose -f docker-compose.gas-stub.yaml up -d

services:
  gas-stub:
    image: nginx:1.27-alpine
    container_name: rrelayer-horizen-gas-stub
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./horizen-gas.json:/usr/share/nginx/html/horizen-gas.json:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 10s
      timeout: 3s
      retries: 3
