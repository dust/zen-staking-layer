# Merge into your rrelayer project rrelayer.yaml (Horizen network block + gas_providers).
#
# Prerequisites:
#   - Production compose: nginx edge (see docker-compose.yml) serves gas on :8787 internally
#   - Local/dev: docker-compose.gas-stub.yaml + endpoint http://localhost:8787

networks:
  - name: horizen_testnet
    chain_id: 2651420
    provider_urls:
      - https://horizen-testnet.rpc.caldera.xyz/http
    block_explorer_url: https://horizen.calderaexplorer.xyz
    max_gas_price_multiplier: 4
    gas_bump_blocks_every:
      slow: 10
      medium: 5
      fast: 4
      super_fast: 2
    gas_provider: CUSTOM
    # Scoped BFF keys — `relayer` is the EOA address (0x...), keys are secrets from .env.
    api_keys:
      - relayer: "${RRELAYER_EOA_ADDRESS}"
        keys:
          - "${RRELAYER_API_KEY}"
    # ... your existing permissions / allowlist for StLighter proxy ...
    # Wave A/B: also allow InboundStation + EgressStation (NOT ZenOftStationBridge).
    # Redeem to Base needs native `value` on EgressStation.bridgeToBase — do not leave
    # disable_native_transfer: true unless you have a per-to exception for Egress.

gas_providers:
  custom:
    # Production compose (nginx edge on same network):
    endpoint: "http://nginx:8787"
    # Host-only rrelayer start (docker-compose.gas-stub.yaml):
    # endpoint: "http://localhost:8787"
    supported_chains: [2651420]
