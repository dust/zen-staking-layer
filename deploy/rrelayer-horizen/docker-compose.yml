volumes:
  postgres_data:
    driver: local

services:
  postgresql:
    image: postgres:16
    container_name: rrelayer-db
    shm_size: 1g
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5441:5432
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 13s
      timeout: 5s
      retries: 5
  gas-stub:
    image: nginx:1.27-alpine
    container_name: rrelayer-horizen-gas-stub
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./horizen-gas.json:/usr/share/nginx/html/horizen-gas.json:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 37s
      timeout: 3s
      retries: 3
  rrelayer:
    image: ghcr.io/joshstevens19/rrelayer
    container_name: rrelayer-service
    restart: always
    # 解决之前遇到的 "No such file or directory (os error 2)" 报错
    # 如果该镜像内部需要调用 docker 指令，必须挂载宿主机的 docker socket
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECT_PATH:-.}:/app/project
    command: start
    ports:
      - "3030:3030"
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      # 强制覆盖 DATABASE_URL 以确保使用 docker 内部网络连接数据库
      # 注意：主机名使用服务名 'postgresql'，端口使用容器内部端口 '5432'
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      - HOST=0.0.0.0
      - BIND=0.0.0.0
      - RRELAYER_HOST=0.0.0.0
      - RRELAYER_PORT=8000
    depends_on:
      postgresql:
        condition: service_healthy
      gas-stub:
        condition: service_healthy
