# Local docker stack for rrelayer + dynamic CUSTOM gas.
#   Host → http://127.0.0.1:8000  (rrelayer)
#   rrelayer → http://gas-stub:8787/{chainId}
#   rrelayer → postgresql:5432
#   Host → http://127.0.0.1:8787/{chainId}  (gas smoke test)

volumes:
  postgres_data:
    driver: local

services:
  postgresql:
    image: postgres:16
    container_name: rrelayer-db
    shm_size: 1g
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 13s
      timeout: 5s
      retries: 5

  gas-stub:
    build:
      context: ../gas-provider
    image: ltzen-gas-provider:${IMAGE_TAG:-latest}
    container_name: rrelayer-horizen-gas-stub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      LISTEN_ADDR: ":8787"
      CACHE_TTL_SECONDS: ${GAS_CACHE_TTL_SECONDS:-10}
      FLOOR_PRIORITY_WEI: ${GAS_FLOOR_PRIORITY_WEI:-1000000}
      CEIL_PRIORITY_WEI: ${GAS_CEIL_PRIORITY_WEI:-1000000000}
      CEIL_MAX_FEE_WEI: ${GAS_CEIL_MAX_FEE_WEI:-5000000000}
      RPC_2651420: ${GAS_RPC_2651420:-https://horizen-testnet.rpc.caldera.xyz/http}
      RPC_26514: ${GAS_RPC_26514:-https://horizen.calderachain.xyz/http}
    healthcheck:
      test: ["CMD", "/gas-provider", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  rrelayer:
    image: ghcr.io/joshstevens19/rrelayer
    container_name: rrelayer-service
    restart: unless-stopped
    volumes:
      - ${PROJECT_PATH:-.}:/app/project
    command: start
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      HOST: "0.0.0.0"
      BIND: "0.0.0.0"
      RRELAYER_HOST: "0.0.0.0"
      RRELAYER_PORT: "8000"
    depends_on:
      postgresql:
        condition: service_healthy
      gas-stub:
        condition: service_healthy
