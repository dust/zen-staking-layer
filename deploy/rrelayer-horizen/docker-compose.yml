# Production topology (VPS):
#   Internet → :80/:443 (nginx) → rrelayer:8000 (compose network)
#   Vercel BFF → https://rrelayer.lighter.im  (API key auth)
#   rrelayer → http://nginx:8787/{chainId}  (CUSTOM gas; internal)
#   rrelayer → postgresql:5432              (internal)
#
# Do NOT publish 8000 / 3030 / 5441 / 8787 to the public internet.

volumes:
  postgres_data:
    driver: local

services:
  postgresql:
    image: postgres:16
    container_name: rrelayer-db
    shm_size: 1g
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host ports — only reachable on the compose network.
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 13s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: rrelayer-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./horizen-gas.json:/usr/share/nginx/html/horizen-gas.json:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Host path to TLS material (see README — symlink from Let's Encrypt).
      - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
      - ./certbot-www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 37s
      timeout: 3s
      retries: 3

  rrelayer:
    image: ghcr.io/joshstevens19/rrelayer
    container_name: rrelayer-service
    restart: always
    volumes:
      # Uncomment only if `rrelayer start` fails with os error 2 and needs the host Docker CLI.
      # Mounting docker.sock grants near-root access to the host — avoid on public VPS when possible.
      # - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECT_PATH:-.}:/app/project
    command: start
    # No host ports — BFF reaches the API via nginx :443 only.
    expose:
      - "8000"
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      # Bind all interfaces *inside* the container so nginx on the compose network can connect.
      # This does not publish the port to the public internet (no `ports:` mapping).
      - HOST=0.0.0.0
      - BIND=0.0.0.0
      - RRELAYER_HOST=0.0.0.0
      - RRELAYER_PORT=8000
    depends_on:
      postgresql:
        condition: service_healthy
      nginx:
        condition: service_healthy
