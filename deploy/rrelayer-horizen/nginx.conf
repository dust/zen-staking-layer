# Production edge + Horizen CUSTOM gas for rrelayer on VPS.
#
# Public:  :80 / :443  → https://rrelayer.lighter.im  → rrelayer:8000
# Internal only: :8787 → gas JSON (rrelayer CUSTOM provider; not published)
#
# TLS: mount Let's Encrypt (or other) certs at /etc/nginx/certs — see README.

# ---------------------------------------------------------------------------
# Internal gas provider (compose network only — do not publish to host)
# rrelayer: GET http://nginx:8787/2651420
# ---------------------------------------------------------------------------
server {
    listen 8787;
    server_name _;

    location ~ ^/[0-9]+$ {
        default_type application/json;
        alias /usr/share/nginx/html/horizen-gas.json;
        add_header Cache-Control "no-cache";
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
}

# ---------------------------------------------------------------------------
# ACME + HTTP → HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name rrelayer.lighter.im;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Public API — TLS terminate, reverse-proxy to rrelayer (Docker DNS)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name rrelayer.lighter.im;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # rrelayer auth (API key / basic) still applies; nginx does not replace it.
    client_max_body_size 1m;

    location / {
        proxy_pass http://rrelayer:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
