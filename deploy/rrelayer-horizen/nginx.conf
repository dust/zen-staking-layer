# Serves horizen-gas.json for rrelayer CUSTOM gas provider.
# rrelayer requests: GET {endpoint}/{chainId}  e.g. http://gas-stub:8787/2651420

server {
    listen 8787;
    server_name _;

    location ~ ^/[0-9]+$ {
        default_type application/json;
        alias /usr/share/nginx/html/horizen-gas.json;
        add_header Cache-Control "no-cache";
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
}
