# Local/dev gas-only nginx (used by docker-compose.gas-stub.yaml).
# Production uses nginx.conf (TLS edge + internal gas).

server {
    listen 8787;
    server_name _;

    location ~ ^/[0-9]+$ {
        default_type application/json;
        alias /usr/share/nginx/html/horizen-gas.json;
        add_header Cache-Control "no-cache";
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }
}
